[project]
name = "rag-tut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saksham", email = "sakshambhardwaj.2k5@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-tut = "rag_tut:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
